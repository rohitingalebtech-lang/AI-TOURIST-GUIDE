{% extends "base.html" %}

{% block title %}500 — Server Error | Yātrā AI{% endblock %}

{% block content %}
<section class="error-page-section">
    <div class="container error-container">
        <div class="error-card">
            <span class="error-code">500</span>
            <h1 class="error-title">Temporary Roadblock</h1>
            <p class="error-desc">
                We encountered an internal processing issue while loading this travel data. Please try refreshing or return to the homepage.
            </p>
            <div class="error-actions">
                <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Homepage</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
